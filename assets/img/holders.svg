<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 400" role="img" aria-label="Авторы проекта">
  <!-- Фото владельцев: две фигуры без лиц. Слева — светло-русый, справа — черноволосый. Волосы растрёпаны. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.4" y2="1">
      <stop offset="0" stop-color="#e3e8e3"/>
      <stop offset="1" stop-color="#c9d1cb"/>
    </linearGradient>
    <radialGradient id="skinL" cx="0.42" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#efd5bd"/>
      <stop offset="1" stop-color="#d9b496"/>
    </radialGradient>
    <radialGradient id="skinR" cx="0.42" cy="0.4" r="0.7">
      <stop offset="0" stop-color="#e9cbb0"/>
      <stop offset="1" stop-color="#cfa686"/>
    </radialGradient>
  </defs>
  <rect width="300" height="400" fill="url(#bg)"/>

  <!-- левый: светло-русый -->
  <g>
    <path d="M10 400 C14 322 44 272 104 264 C164 272 194 322 198 400 Z" fill="#4a5662"/>
    <path d="M88 226 h32 v36 c-6 8 -26 8 -32 0 Z" fill="#d4ad8d"/>
    <path d="M86 262 l18 22 l18 -22 Z" fill="#eef0ea"/>
    <ellipse cx="104" cy="182" rx="45" ry="57" fill="url(#skinL)"/>
    <g fill="#c8a56c">
      <!-- шапка волос с неровной чёлкой, пряди зачёсаны в разные стороны -->
      <path d="M58 200 C50 150 66 110 104 106 C144 104 160 146 150 200 Q147 172 138 160
        Q133 178 120 150 Q112 170 100 152 Q90 174 80 154 Q70 168 58 200 Z"/>
      <!-- торчащие пряди -->
      <path d="M80 118 Q68 104 62 94 Q80 98 94 112 Z"/>
      <path d="M98 110 Q96 94 102 84 Q108 96 114 108 Z"/>
      <path d="M120 110 Q132 96 144 92 Q138 104 130 116 Z"/>
      <path d="M146 136 Q160 130 168 134 Q158 140 150 150 Z"/>
      <path d="M62 142 Q50 138 46 144 Q54 148 60 158 Z"/>
    </g>
    <g fill="none" stroke="#e3c793" stroke-width="3" stroke-linecap="round">
      <path d="M78 128 q16 -14 36 -10"/>
      <path d="M124 124 q12 6 16 18"/>
    </g>
  </g>

  <!-- правый: черноволосый -->
  <g>
    <path d="M104 400 C108 316 140 266 202 258 C264 266 296 316 300 400 Z" fill="#2c3138"/>
    <path d="M186 220 h32 v36 c-6 8 -26 8 -32 0 Z" fill="#c9a07f"/>
    <path d="M184 256 l18 22 l18 -22 Z" fill="#e6e9e4"/>
    <ellipse cx="202" cy="176" rx="45" ry="57" fill="url(#skinR)"/>
    <g fill="#1f1c1b">
      <path d="M156 194 C148 144 164 104 202 100 C242 98 258 140 248 194 Q244 166 234 154
        Q228 174 216 146 Q206 166 194 146 Q184 170 174 150 Q166 164 156 194 Z"/>
      <path d="M172 112 Q160 100 156 90 Q172 94 186 106 Z"/>
      <path d="M192 104 Q190 88 198 78 Q204 90 208 102 Z"/>
      <path d="M214 104 Q228 90 242 88 Q236 100 226 112 Z"/>
      <path d="M244 128 Q258 122 266 126 Q256 134 248 144 Z"/>
      <path d="M160 132 Q148 128 144 134 Q152 138 158 150 Z"/>
    </g>
    <g fill="none" stroke="#4a4541" stroke-width="3" stroke-linecap="round">
      <path d="M176 122 q16 -14 36 -10"/>
      <path d="M222 118 q12 6 16 18"/>
    </g>
  </g>
</svg>
