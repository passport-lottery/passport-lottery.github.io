<!-- Заставка загрузки: градиент на весь экран, по центру рисуется глобус. Днём (до заката в Тирасполе)
     светлая, после заката — графитовая. Если на устройстве тёмная тема, всегда графитовая.
     Видна, пока не догрузятся шрифты и текстуры, потом растворяется. Без JS не появляется вовсе. -->
<script>
  (function () {
    var d = document.documentElement;
    d.classList.add('booting');
    // восход и закат по солнцу для Тирасполя на сегодня (точность — минуты; летнее время учитывается само)
    function isDay(now) {
      var lat = 46.84, lon = 29.63, rad = Math.PI / 180;
      var start = Date.UTC(now.getUTCFullYear(), 0, 0), n = Math.floor((now - start) / 864e5);
      var decl = 23.44 * Math.sin(2 * Math.PI * (284 + n) / 365);
      var B = 2 * Math.PI * (n - 81) / 364, eot = 9.87 * Math.sin(2 * B) - 7.53 * Math.cos(B) - 1.5 * Math.sin(B);
      var cosH = (Math.sin(-0.83 * rad) - Math.sin(lat * rad) * Math.sin(decl * rad)) / (Math.cos(lat * rad) * Math.cos(decl * rad));
      var H = Math.acos(Math.max(-1, Math.min(1, cosH))) / rad;
      var noon = 12 - lon / 15 - eot / 60, utc = now.getUTCHours() + now.getUTCMinutes() / 60;
      return utc > noon - H / 15 && utc < noon + H / 15;
    }
    var force = (location.search.match(/[?&]boot=(day|night)/) || [])[1];   // для проверки: ?boot=day / ?boot=night
    var darkUi = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
    if (force ? force === 'day' : (!darkUi && isDay(new Date()))) d.classList.add('boot-day');
  })();
  window.__fontsCss = new Promise(function (r) { window.__fontsCssDone = r; });
</script>
<style>
  html{background:#e9ece2}
  @media (prefers-color-scheme: dark){html{background:#131816}}
  html.booting{background:#1e2022}
  html.booting.boot-day{background:#e4e7e1}
  #boot{display:none}
  html.booting #boot{display:grid;position:fixed;inset:0;z-index:1000;place-items:center;
    background:radial-gradient(130% 90% at 50% 50%, #5c6062 0%, #3d4043 34%, #25272a 66%, #131415 100%);transition:opacity .5s ease}
  html.booting.boot-day #boot{background:radial-gradient(130% 90% at 50% 50%, #fbfcf9 0%, #eef0eb 36%, #dfe3dc 68%, #c9cec6 100%)}
  html.boot-done #boot{opacity:0;pointer-events:none}
  #boot .bk{display:grid;place-items:center}
  #boot svg{width:64px;height:64px;fill:none;stroke:#d3d6d5;stroke-width:1.25;stroke-linecap:round;filter:drop-shadow(0 0 6px rgba(255,255,255,.12))}
  html.boot-day #boot svg{stroke:#5f6562;filter:none}
  #boot svg *{stroke-dasharray:1;stroke-dashoffset:1;animation:boot-draw .38s cubic-bezier(.65,0,.35,1) forwards}
  #boot svg :nth-child(1){animation-delay:.08s;animation-duration:.5s}
  #boot svg :nth-child(2){animation-delay:.3s}
  #boot svg :nth-child(3){animation-delay:.38s}
  #boot svg :nth-child(4){animation-delay:.44s}
  #boot svg :nth-child(5){animation-delay:.5s}
  @keyframes boot-draw{to{stroke-dashoffset:0}}
  @media (prefers-reduced-motion: reduce){#boot svg *{animation:none;stroke-dashoffset:0}}
</style>

<script>
  /* Убрать заставку, когда готовы кожа обложки, бумага и шрифты (шрифты ждём не дольше 1,5 с после
     картинок). Предел — 4 с после разбора страницы: дальше обложка ровного цвета, кожа подставится сама. */
  (function () {
    var d = document.documentElement, done = false;
    if (!d.classList.contains('booting')) return;
    // не меньше 0,85 с от начала загрузки — чтобы глобус успел дорисоваться и не было чёрной вспышки
    var MIN_SHOW = 850;
    function finish() {
      if (done) return;
      done = true;
      setTimeout(function () {
        d.classList.add('boot-done');
        setTimeout(function () {
          var b = document.getElementById('boot');
          if (b) b.remove();
          d.classList.remove('booting', 'boot-done');
        }, 520);
      }, Math.max(0, MIN_SHOW - performance.now()));
    }
    function img(src) {
      return new Promise(function (r) {
        if (!src) return r();
        var i = new Image();
        i.onload = function () { (i.decode ? i.decode() : Promise.resolve()).then(r, r); };
        i.onerror = r;
        i.src = src;
      });
    }
    var tx = (window.SITE && SITE.textures) || {};
    var fonts = window.__fontsCss.then(function () {
      if (!document.fonts) return;
      return Promise.all([
        document.fonts.load('800 30px "Alegreya SC"'),
        document.fonts.load('400 16px "PT Sans"'),
        document.fonts.load('400 12px "PT Mono"')
      ]).catch(function () {});
    });
    function delay(ms) { return new Promise(function (r) { setTimeout(r, ms); }); }
    Promise.all([img(tx.cover), img(tx.paper)])
      .then(function () { return Promise.race([fonts, delay(1500)]); })
      .then(finish, finish);
    setTimeout(finish, 4000);
  })();
</script>
